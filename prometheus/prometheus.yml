global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'crm_web_app'
    static_configs:
      - targets: ['crm_app:5000']

  - job_name: 'postgres_db'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'docker_containers'
    static_configs:
      - targets: ['cadvisor:8080']
